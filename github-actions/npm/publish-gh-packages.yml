# This workflow build and publishes an npm package to GitHub Packages registry
# the published package will then appear at 'https://github.com/gh_username?tab=packages'

name: Publish Package - GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

# # or
# on:
#   push:
#     tags:
#       - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish-gh-packages:
    name: Publish package to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Setup .npmrc file to publish to GitHub Packages
      - name: Setup Web environment
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          # never use caching in release builds
          # ref: https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow
          package-manager-cache: false

      - name: Install packages
        run: yarn install --immutable # or 'npm ci'

      - name: Build the plugin
        run: yarn build # or 'npm run build'

      - name: Publish Package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
